[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "food-facts-agent"
version = "0.1.0"
description = "Answers consumer questions about food products using Open Food Facts and Claude tool use"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Konrad Kloska" }]
dependencies = [
    "anthropic>=1.15,<2",
    "httpx2>=2.13",
    "python-dotenv>=1.2",
]

[project.scripts]
food-facts = "food_facts_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
